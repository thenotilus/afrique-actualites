parameters:
    # User-agent de récupération des flux (§6). S'identifie explicitement comme le bot d'Afrique
    # Actualités, dans le même esprit que les profils de crawl (§9.4, config/packages/crawler.yaml) :
    # jamais d'usurpation d'un navigateur pour contourner un blocage (§11.4).
    feed.user_agent: 'AfriqueActualitesBot/1.0 (Feed Reader; +https://www.afrique-actualites.com/a-propos/bot; crawl@afrique-actualites.com)'

    # Délai d'attente (secondes) de la requête HTTP de récupération d'un flux.
    feed.request_timeout: 10.0

    # Garde-fou du backfill historique (§6bis, `app:feed:backfill`) : nombre maximum de documents
    # sitemap (index et feuilles confondus) suivis par média avant d'arrêter la récupération —
    # évite qu'une arborescence de sitemaps démesurée ou une référence circulaire ne bloque la
    # commande indéfiniment.
    feed.backfill_max_sitemaps: 200
