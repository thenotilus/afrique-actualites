framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # File d'attente Doctrine (table `messenger_messages`, créée par
            # `php bin/console messenger:setup-transports`). Le crawl de repli (§9.4) y est routé
            # pour ne jamais bloquer la récupération RSS, et surtout pour que la reprogrammation
            # via `DelayStamp` (quota de domaine épuisé) soit réellement différée : sur le transport
            # `sync`, ce délai était ignoré et le handler se re-dispatchait en boucle récursive
            # jusqu'à épuisement mémoire. Traité par un worker `messenger:consume async`.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Crawler\Message\CrawlArticleMetaMessage: async

when@test:
    framework:
        messenger:
            transports:
                # En test, aucun worker ne tourne : les messages sont simplement collectés
                # en mémoire (pas de table, pas d'exécution). Les tests qui vérifient le
                # comportement du crawl injectent de toute façon un bus dédié.
                async: 'in-memory://'
