framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Le crawl de repli (§9.4) doit rester asynchrone pour ne jamais bloquer l'extraction
            # RSS principale sur un site source lent — mais un vrai transport en file d'attente
            # (Doctrine, Redis...) reste à brancher avant la mise en production : voir la note sur
            # les traitements continus dans docs/architecture.md. Le transport `sync` ci-dessus
            # n'est qu'un point de départ de scaffolding.
            App\Crawler\Message\CrawlArticleMetaMessage: sync

