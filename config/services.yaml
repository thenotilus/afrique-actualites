# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            # Entités, énumérations et objets-valeur : simples classes de données par domaine
            # (src/<Domaine>/Entity, src/<Domaine>/Enum, src/Shared/ValueObject), jamais des
            # services. Le pattern par défaut du squelette Symfony (../src/Entity/) ne couvrait
            # que l'ancienne structure plate ; ici il faut exclure sous chaque domaine.
            - '../src/*/Entity/'
            - '../src/*/Enum/'
            - '../src/Shared/ValueObject/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Pipeline de classification (§10.1) : une seule implémentation de chaque étape aujourd'hui,
    # mais le tout passe par des interfaces pour rester remplaçable (ex. stemmer linguistique
    # dédié en remplacement de LightSuffixStemmer, cf. son docblock) sans toucher au reste.
    App\Classification\Pipeline\NormalizerInterface: '@App\Classification\Pipeline\UnicodeNormalizer'
    App\Classification\Pipeline\TokenizerInterface: '@App\Classification\Pipeline\RegexTokenizer'
    App\Classification\Pipeline\StopWordFilterInterface: '@App\Classification\Pipeline\StopWordFilter'
    App\Classification\Pipeline\StemmerInterface: '@App\Classification\Pipeline\LightSuffixStemmer'
    App\Classification\Pipeline\NamedEntityRecognizerInterface: '@App\Classification\Pipeline\CountryNamedEntityRecognizer'
    App\Classification\Pipeline\ScorerInterface: '@App\Classification\Pipeline\BatchFrequencyScorer'

    App\Classification\Pipeline\RegexTokenizer:
        arguments:
            $minWordLength: '%classification.min_word_length%'

    App\Classification\Pipeline\StopWordFilter:
        arguments:
            $resourcesDirectory: '%kernel.project_dir%/src/Classification/Resources/stopwords'

    App\Classification\ClassificationService:
        arguments:
            $minDocumentFrequency: '%classification.min_document_frequency%'
            $maxDocumentFrequencyRatio: '%classification.max_document_frequency_ratio%'

    App\Classification\Command\RunClassificationCommand:
        arguments:
            $defaultWindowHours: '%classification.window_hours%'

    # Crawling multi-bots (§9.4) : une seule implémentation d'extraction de métadonnées à ce
    # stade, derrière une interface pour rester remplaçable (ex. un extracteur dédié pour un site
    # aux balises non standard) sans toucher à l'orchestration.
    App\Crawler\MetaExtractorInterface: '@App\Crawler\OpenGraphMetaExtractor'

    App\Crawler\BotProfileRegistry:
        arguments:
            $profileConfigs: '%crawler.bot_profiles%'

    App\Crawler\CrawlerService:
        arguments:
            $crawlerCache: '@cache.crawler'
            $cacheTtlSeconds: '%crawler.cache_ttl%'

    # Récupération des articles (§6) : lecture des flux RSS/Atom actifs et création des articles.
    App\Feed\FeedIngester:
        arguments:
            $userAgent: '%feed.user_agent%'
            $requestTimeout: '%feed.request_timeout%'
