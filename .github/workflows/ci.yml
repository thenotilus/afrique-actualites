name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: afrique_actualites_test
          MYSQL_USER: app
          MYSQL_PASSWORD: "!ChangeMe!"
          MYSQL_ROOT_PASSWORD: "!ChangeMeRoot!"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://app:!ChangeMe!@127.0.0.1:3306/afrique_actualites_test?serverVersion=8.0.36&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Add dev-only static analysis tooling
        run: composer require --dev --no-interaction phpstan/phpstan phpstan/phpstan-symfony

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: php bin/console lint:twig templates --env=test
        continue-on-error: true # pas de templates avant la phase 6 du plan de refonte

      - name: Lint container
        run: php bin/console lint:container

      - name: Coding standards (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
