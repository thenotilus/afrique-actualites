# Dictionnaire thématique français (§ "Clustering par sous-thème"). Chaque clé est la valeur
# d'un cas de `App\Synthesis\Enum\Theme` ; chaque entrée est un mot ou une courte expression
# recherchée (insensible aux accents/majuscules, comparée après le même `NormalizerInterface` que
# le reste du pipeline de classification) dans le titre + chapô d'un article. Modifiable sans
# toucher au code, à l'image de Classification/Resources/stopwords/.
