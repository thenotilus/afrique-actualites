; Paramètres PHP — environnement de développement afrique-actualites

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
; Les crawls de repli (§9.4) peuvent être lents : marge confortable en dev
max_execution_time = 120

date.timezone = Europe/Paris

; En dev on revalide les timestamps pour voir les changements immédiatement
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

realpath_cache_size = 4096K
realpath_cache_ttl = 600
